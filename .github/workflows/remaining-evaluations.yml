name: Remaining 400-case Sonnet and Opus evaluations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remaining-evaluations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-sample:
    name: Prepare fixed benchmark and Semgrep evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out experiment code
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python syntax before any API charges
        run: |
          python -m py_compile scripts/prepare.py scripts/sample.py scripts/scan_sample.py scripts/evaluate_remaining.py scripts/standalone_haiku.py scripts/hybrid_haiku.py
      - name: Install pinned Semgrep
        run: python -m pip install "semgrep==1.185.0"
      - name: Fetch pinned benchmark
        run: python scripts/prepare.py
      - name: Reproduce same fixed 400-case sample
        run: python scripts/sample.py
      - name: Scan selected cases for both hybrid configurations
        run: python scripts/scan_sample.py
      - name: Archive sample and raw Semgrep baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-400-sample-and-semgrep
          path: results/
          retention-days: 90
          if-no-files-found: warn

  evaluate:
    name: ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    needs: prepare-sample
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - configuration: standalone-sonnet
            max_usd: "5.00"
          - configuration: hybrid-sonnet
            max_usd: "5.00"
          - configuration: standalone-opus
            max_usd: "8.50"
          - configuration: hybrid-opus
            max_usd: "8.50"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Anthropic SDK
        run: python -m pip install "anthropic>=1,<2"
      - name: Fetch pinned OWASP Benchmark
        run: python scripts/prepare.py
      - name: Reproduce identical 400-case sample locally
        run: |
          python scripts/sample.py
          sha256sum results/stratified_sample_400.csv > /tmp/sample-manifest.sha
      - name: Load Semgrep baseline and official sample manifest
        uses: actions/download-artifact@v4
        with:
          name: remaining-400-sample-and-semgrep
          path: results/
      - name: Check sample identity
        run: sha256sum -c /tmp/sample-manifest.sha
      - name: Run independently cost-capped Claude configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_CONFIGURATION: ${{ matrix.configuration }}
          MAX_USD: ${{ matrix.max_usd }}
        run: |
          python -u scripts/evaluate_remaining.py \
            --configuration "$EVAL_CONFIGURATION" \
            --max-usd "$MAX_USD"
      - name: Save every model decision, token count, latency and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.configuration }}-400-results
          path: results/${{ matrix.configuration }}/
          retention-days: 90
          if-no-files-found: warn
