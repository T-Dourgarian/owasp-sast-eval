name: Stratified 400-case Semgrep and Haiku hybrid
# Rerun after removing unsupported Claude SDK temperature parameter.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sample-haiku.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-and-haiku:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep and Claude SDK
        run: python -m pip install "semgrep>=1.100,<2" "anthropic>=0.60,<2"
      - name: Fetch pinned OWASP Benchmark
        run: python scripts/prepare.py
      - name: Generate reproducible 400-case stratified sample
        run: python scripts/sample.py
      - name: Execute Semgrep on selected 400 cases
        run: python scripts/scan_sample.py
      - name: Validate all Semgrep findings with Claude Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HYBRID_MAX_USD: "1.00"
        run: python scripts/hybrid_haiku.py
      - name: Upload complete experiment records and partial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-400-semgrep-and-haiku-hybrid
          path: results/
          if-no-files-found: warn
          retention-days: 90
