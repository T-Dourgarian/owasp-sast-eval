name: OWASP Semgrep baseline and Claude cost estimate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/semgrep-baseline.yml"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out experiment scripts
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install "semgrep>=1.100,<2"
      - name: Fetch pinned OWASP Benchmark
        run: python scripts/prepare.py
      - name: Execute Semgrep scan
        run: python scripts/scan.py
      - name: Analyze baseline and estimate Claude token costs
        run: python scripts/estimate.py
      - name: Store raw results and cost estimate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-baseline-and-claude-cost-estimate
          path: results/
          if-no-files-found: warn
          retention-days: 90
