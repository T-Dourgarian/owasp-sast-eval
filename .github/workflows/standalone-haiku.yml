name: Standalone Haiku on the stratified 400-case sample

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standalone-haiku.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-haiku:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Anthropic SDK
        run: python -m pip install "anthropic>=0.60,<2"
      - name: Validate script syntax before paid API calls
        run: python -m py_compile scripts/prepare.py scripts/sample.py scripts/standalone_haiku.py
      - name: Download pinned benchmark
        run: python scripts/prepare.py
      - name: Reproduce the same stratified 400-case sample
        run: python scripts/sample.py
      - name: Run standalone Haiku on all 400 selected Java files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STANDALONE_MAX_USD: "1.00"
        run: python -u scripts/standalone_haiku.py
      - name: Upload sample, detailed usage and comparison metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-haiku-400-results
          path: results/
          if-no-files-found: warn
          retention-days: 90
